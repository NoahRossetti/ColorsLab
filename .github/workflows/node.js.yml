name: LAMP Project Node.js Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install PHP Dependencies (Composer)
        run: composer install --prefer-dist --no-progress

      - name: Install Node.js Dependencies (npm)
        run: npm ci

      - name: Build Frontend Assets (Vite / Webpack)
        run: npm run build

      - name: Run Tests
        run: npm test
